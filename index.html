<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swarm vault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='%23C9F73A'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="wordmark">swarm vault</div>
    <div id="search-mount">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="search-input" type="text" placeholder="search swarms  (ctrl+k)" autocomplete="off" spellcheck="false">
        <ul id="search-list" hidden></ul>
      </div>
    </div>
    <div class="hud-status"><span class="live-dot"></span><span id="hud-text">connecting</span></div>
  </header>
  <div id="stage">
    <canvas id="grid"></canvas>
    <div id="world-layer"></div>
  </div>
  <div id="swarm-mount"></div>
  <footer id="statusbar">
    <span class="sync-dot"></span>
    <span id="status-text"></span>
    <span id="status-totals"></span>
  </footer>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
